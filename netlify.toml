# Configuració d'allotjament a Netlify — lloc estàtic + funcions serverless
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Rutes curtes per a l'API de reserves
[[redirects]]
  from = "/api/disponibilitat"
  to = "/.netlify/functions/disponibilitat"
  status = 200
[[redirects]]
  from = "/api/reserva"
  to = "/.netlify/functions/reserva"
  status = 200
[[redirects]]
  from = "/api/alta-soci"
  to = "/.netlify/functions/alta-soci"
  status = 200
[[redirects]]
  from = "/api/baixa-soci"
  to = "/.netlify/functions/baixa-soci"
  status = 200
[[redirects]]
  from = "/api/contacte"
  to = "/.netlify/functions/contacte"
  status = 200

# Cau curt per als índexs de dades editables
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
