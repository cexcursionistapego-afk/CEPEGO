# Configuració d'allotjament a Netlify — lloc estàtic + funcions serverless
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Rutes curtes per a l'API de reserves
[[redirects]]
  from = "/api/disponibilitat"
  to = "/.netlify/functions/disponibilitat"
  status = 200
[[redirects]]
  from = "/api/reserva"
  to = "/.netlify/functions/reserva"
  status = 200
[[redirects]]
  from = "/api/alta-soci"
  to = "/.netlify/functions/alta-soci"
  status = 200
[[redirects]]
  from = "/api/baixa-soci"
  to = "/.netlify/functions/baixa-soci"
  status = 200
[[redirects]]
  from = "/api/contacte"
  to = "/.netlify/functions/contacte"
  status = 200
[[redirects]]
  from = "/api/meteo"
  to = "/.netlify/functions/meteo"
  status = 200
[[redirects]]
  from = "/api/aemet"
  to = "/.netlify/functions/aemet"
  status = 200

# Redirecció de l'antiga pàgina de meteo de Pego, ara unificada en una sola
[[redirects]]
  from = "/meteo-pego.html"
  to = "/meteo.html"
  status = 301

# Redireccions d'URLs de la web anterior (Wix), per a que Google actualitze
# l'índex cap a les URLs noves en lloc de deixar-les caure a poc a poc.
[[redirects]]
  from = "/refugi-la-figuereta"
  to = "/es/refugi.html"
  status = 301
  force = true
  [redirects.query]
    lang = "es"
[[redirects]]
  from = "/refugi-la-figuereta"
  to = "/refugi.html"
  status = 301
  force = true

# Cau curt per als índexs de dades editables
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
