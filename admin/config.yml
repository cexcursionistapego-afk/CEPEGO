backend:
  name: git-gateway
  branch: claude/rerun-test-download-site-hjl80a

# Idioma del panell
locale: "es"

# On es guarden les imatges pujades des del panell
media_folder: "img/calendari"
public_folder: "/img/calendari"

publish_mode: simple

collections:
  # ---------- CALENDARI ----------
  - name: "calendari"
    label: "📅 Calendari — cartells i fotos"
    description: "Afig, reordena o elimina els cartells i fotos del calendari d'activitats."
    files:
      - name: "fotos"
        label: "Fotos del calendari"
        file: "data/calendari.json"
        description: "Puja la imatge del cartell i, opcionalment, un text. Arrossega per reordenar."
        fields:
          - label: "Fotos"
            name: "fotos"
            label_singular: "Cartell / foto"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "Imatge", name: "image", widget: "image" }
              - { label: "Text (opcional)", name: "caption", widget: "string", required: false }

  # ---------- AJUSTOS DEL CLUB ----------
  - name: "ajustos"
    label: "⚙️ Dades del club (contacte i preus)"
    description: "Correu, telèfon, adreça, Facebook, IBAN, preus del refugi, quotes de soci, l'avís blau de la pàgina de reservar i la data de cua de reserves. Es canvien en tota la web alhora."
    files:
      - name: "site"
        label: "Dades i preus"
        file: "data/site.json"
        fields:
          - { label: "Correu electrònic", name: "email", widget: "string" }
          - { label: "Telèfon", name: "telefon", widget: "string" }
          - { label: "Adreça", name: "adreca", widget: "string" }
          - { label: "Facebook (enllaç complet)", name: "facebook", widget: "string" }
          - { label: "Preu 1 nit", name: "preu1", widget: "string" }
          - { label: "Preu 2 nits", name: "preu2", widget: "string" }
          - { label: "Preu 3 nits", name: "preu3", widget: "string" }
          - { label: "Quota de soci (a l'any)", name: "quota_soci", widget: "string" }
          - { label: "Quota sala d'entrenament", name: "quota_sala", widget: "string" }
          - { label: "Avís blau a Reservar (valencià)", name: "avis_reserva_va", widget: "text" }
          - { label: "Avís blau a Reservar (castellà)", name: "avis_reserva_es", widget: "text" }
          - { label: "Reserves en cua a partir de (deixa-ho buit per a desactivar)", name: "reserves_cua_desde", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false, hint: "Si poses una data, qui intente reservar per a eixe dia o posteriors podrà enviar la sol·licitud igualment, però se li avisarà que encara no s'han obert les reserves i que entra en una cua per ordre d'arribada. Deixa-ho buit per a tornar al funcionament normal." }

  # ---------- AVÍS / NOVETAT ----------
  - name: "avis"
    label: "📢 Avís a la portada"
    description: "Barra d'avís a dalt de la pàgina d'inici (per exemple: pròxima eixida, assemblea…)."
    files:
      - name: "avis"
        label: "Avís a la portada"
        file: "data/avis.json"
        fields:
          - { label: "Mostrar l'avís?", name: "actiu", widget: "boolean", default: false }
          - { label: "Text en Valencià", name: "text_va", widget: "string", required: false }
          - { label: "Text en Español", name: "text_es", widget: "string", required: false }

  # ---------- NOTÍCIES (Racó del soci) ----------
  - name: "noticies"
    label: "📰 Notícies (Racó del soci)"
    description: "Notícies que apareixen al Racó del soci (eixides, acampades, obres…). Arrossega per reordenar."
    files:
      - name: "noticies"
        label: "Notícies"
        file: "data/noticies.json"
        fields:
          - label: "Notícies"
            name: "noticies"
            label_singular: "Notícia"
            widget: "list"
            summary: "{{fields.data_va}} — {{fields.text_va}}"
            fields:
              - { label: "Data (Valencià)", name: "data_va", widget: "string", hint: "Ex: 19 i 20 de setembre" }
              - { label: "Fecha (Español)", name: "data_es", widget: "string", hint: "Ej: 19 y 20 de septiembre" }
              - { label: "Text (Valencià)", name: "text_va", widget: "text" }
              - { label: "Texto (Español)", name: "text_es", widget: "text" }

  # ---------- REUNIONS (Racó del soci) ----------
  - name: "reunions"
    label: "🗓️ Reunions (Racó del soci)"
    description: "Pròximes reunions de la junta directiva que apareixen al Racó del soci. Arrossega per reordenar."
    files:
      - name: "reunions"
        label: "Reunions"
        file: "data/reunions.json"
        fields:
          - label: "Reunions"
            name: "reunions"
            label_singular: "Reunió"
            widget: "list"
            summary: "{{fields.data_va}} — {{fields.text_va}}"
            fields:
              - { label: "Data i hora (Valencià)", name: "data_va", widget: "string", hint: "Ex: 9 de setembre, 20:00 h" }
              - { label: "Fecha y hora (Español)", name: "data_es", widget: "string", hint: "Ej: 9 de septiembre, 20:00 h" }
              - { label: "Text (Valencià)", name: "text_va", widget: "text" }
              - { label: "Texto (Español)", name: "text_es", widget: "text" }
